[package]
name = "note-taker"
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["Harrison Knight <hijknight@icloud.com>"]
description = "Note taker is an open source minimal note taking tool built in 30 minutes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hijknight/note-taker.git"

[[bin]]
name = "note-taker"
path = "src/main.rs"


[dependencies]
clap = { version = "4.4", features = ["derive"]}
clap_complete = "4.4"
chrono = "0.4.39"
crossterm = "0.28.1"
serde = {  version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
tui = "0.19.0"

# TODO IMPORTANT: must change editor to vim before publish